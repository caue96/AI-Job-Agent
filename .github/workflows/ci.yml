name: quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobagent_test
          POSTGRES_USER: jobagent_test
          POSTGRES_PASSWORD: jobagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobagent_test -d jobagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      TEST_POSTGRES_URL: postgresql+psycopg://jobagent_test:jobagent_test@localhost:5432/jobagent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check app tests
      - run: ruff check .
      - run: mypy app
      - run: pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80
      - run: coverage report --include='app/ai.py,app/matching.py,app/services.py' --fail-under=90
      - run: bandit -q -r app
      - run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --audit-level high
